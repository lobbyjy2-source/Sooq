<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID SOOQ - إضافة إعلان جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 border-b">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-amber-500 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                </div>
                <span class="text-xl font-black text-gray-900">GRID SOOQ</span>
            </a>
            <a href="index.html" class="text-xs font-bold text-amber-600 hover:underline">
                <i class="fa-solid fa-arrow-right ml-1"></i> العودة للرئيسية
            </a>
        </div>
    </header>

    <!-- Form Container -->
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
            
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black text-gray-900">أضف إعلانك الجديد</h1>
                <p class="text-xs text-gray-400 mt-1">املأ التفاصيل أدناه لنشر إعلانك بسرعة على المنصة</p>
            </div>

            <form class="space-y-4 text-xs">
                
                <!-- Ad Title -->
                <div>
                    <label class="block font-bold mb-1 text-gray-700">عنوان الإعلان</label>
                    <input type="text" placeholder="مثال: آيفون 15 برو ماكس نظيف جداً" class="w-full p-3 border rounded-xl outline-none focus:border-amber-500">
                </div>

                <!-- Category & City -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">القسم الرئيسي</label>
                        <select class="w-full p-3 border rounded-xl outline-none focus:border-amber-500 bg-white">
                            <option>الإلكترونيات</option>
                            <option>السيارات وقطع الغيار</option>
                            <option>عقارات</option>
                            <option>أثاث ومنزل</option>
                            <option>أزياء وملابس</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">المدينة</label>
                        <select class="w-full p-3 border rounded-xl outline-none focus:border-amber-500 bg-white">
                            <option>عمان</option>
                            <option>إربد</option>
                            <option>الزرقاء</option>
                            <option>العقبة</option>
                        </select>
                    </div>
                </div>

                <!-- Price -->
                <div>
                    <label class="block font-bold mb-1 text-gray-700">السعر (د.أ)</label>
                    <input type="number" placeholder="0.00" class="w-full p-3 border rounded-xl outline-none focus:border-amber-500">
                </div>

                <!-- Description -->
                <div>
                    <label class="block font-bold mb-1 text-gray-700">تفاصيل ووصف الإعلان</label>
                    <textarea rows="4" placeholder="اكتب تفاصيل المنتج، الحالة، سبب السبيع..." class="w-full p-3 border rounded-xl outline-none focus:border-amber-500"></textarea>
                </div>

                <!-- Image Upload Simulation -->
                <div>
                    <label class="block font-bold mb-1 text-gray-700">صور المنتج</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer hover:border-amber-500 transition">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                        <p class="text-gray-500 font-bold">اضغط هنا لرفع الصور أو اسحبها هنا</p>
                        <p class="text-[10px] text-gray-400 mt-1">PNG, JPG حتى 10MB</p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl text-sm transition mt-4">
                    نشر الإعلان الآن
                </button>

            </form>

        </div>
    </div>

</body>
</html>
