<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID SOOQ - منصة البيع والشراء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Top Bar -->
    <div class="bg-gray-100 text-xs py-2 border-b border-gray-200">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-4 space-x-reverse text-gray-600">
                <!-- زر تغيير اللغة الحقيقي -->
                <button onclick="toggleRealLanguage()" class="flex items-center cursor-pointer hover:text-amber-600 font-bold bg-white px-2 py-1 rounded border text-xs">
                    <i class="fa-solid fa-globe ml-1 text-amber-500"></i> <span id="langText">English</span>
                </button>
            </div>
            <div class="text-gray-500 flex items-center gap-4">
                <a href="messages.html" class="hover:text-amber-600 font-bold text-gray-700 flex items-center gap-1">
                    <i class="fa-regular fa-comments text-amber-600 text-sm"></i> <span data-key="messages">الرسائل</span>
                    <span class="bg-red-500 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold">1</span>
                </a>
                <span>|</span>
                <a href="favorites.html" class="hover:underline font-bold text-amber-600"><i class="fa-regular fa-heart"></i> <span data-key="favorites">المفضلة</span></a>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="bg-white shadow-sm py-4 border-b">
        <div class="container mx-auto px-4 flex items-center justify-between gap-6">
            <!-- Logo -->
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-amber-500 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-bag-shopping text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-gray-900 leading-none">GRID SOOQ</h1>
                    <span class="text-xs text-gray-400 font-medium" data-key="slogan">تسوق وسوق كل ما تحتاجه</span>
                </div>
            </a>

            <!-- Search Bar -->
            <form onsubmit="handleSearch(event)" class="flex-1 max-w-2xl flex items-center border-2 border-amber-500 rounded-lg overflow-hidden">
                <input id="searchInput" type="text" placeholder="إبحث عن أجهزة، سيارات، ألعاب..." class="w-full py-2 px-4 outline-none text-sm">
                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-2 font-bold">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>

            <!-- User Actions -->
            <div class="flex items-center gap-6">
                <a href="login.html" id="userAuthBtn" class="flex items-center gap-2 text-gray-700 hover:text-amber-600">
                    <i class="fa-regular fa-user text-xl"></i>
                    <div class="text-xs text-right">
                        <div data-key="account">حسابي</div>
                        <div class="font-bold" id="authStatusText" data-key="login">تسجيل دخول</div>
                    </div>
                </a>
                <a href="cart.html" class="flex items-center gap-2 text-gray-700 hover:text-amber-600 relative">
                    <div class="relative">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span id="cartCount" class="absolute -top-2 -right-2 bg-amber-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                    </div>
                    <div class="text-xs text-right">
                        <div data-key="cart">السلة</div>
                        <div class="font-bold" id="cartTotalText">0.00 ر.س</div>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="bg-white border-b text-sm">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center space-x-6 space-x-reverse py-3">
                <a href="categories.html" class="bg-amber-500 text-white px-4 py-2 rounded-md font-bold flex items-center gap-2 text-xs hover:bg-amber-600">
                    <i class="fa-solid fa-bars"></i> <span data-key="allCategories">كل الأقسام</span>
                </a>
                <a href="index.html" class="text-amber-600 font-bold border-b-2 border-amber-600 pb-3 -mb-3" data-key="home">الرئيسية</a>
                <a href="messages.html" class="text-gray-600 hover:text-amber-600 font-medium"><i class="fa-regular fa-comment-dots text-amber-500"></i> <span data-key="chatSellers">محادثات البائعين</span></a>
                <a href="#" onclick="checkAuthAndAddAd(event)" class="text-amber-600 font-bold hover:text-amber-700" data-key="addAd">+ إضافة إعلان</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <div class="container mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-xl font-bold" id="sectionTitle" data-key="latestAds">أحدث الإعلانات والمنتجات</h3>
        </div>

        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
            <!-- Product 1 -->
            <div class="product-item bg-white rounded-xl overflow-hidden border shadow-sm relative group block" data-title="iphone 15 pro max آيفون">
                <a href="product.html">
                    <div class="h-44 bg-gray-100 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover group-hover:scale-105 transition">
                    </div>
                </a>
                <div class="p-3 text-right">
                    <h4 class="font-bold text-xs truncate">iPhone 15 Pro Max</h4>
                    <p class="text-[10px] text-gray-400 mt-1"><i class="fa-solid fa-location-dot"></i> عمان</p>
                    <div class="flex items-center justify-between mt-3">
                        <p class="font-black text-amber-600 text-sm">4,999 ر.س</p>
                        <button onclick="addToCartReal('iPhone 15 Pro Max', 4999)" class="bg-amber-500 text-white text-xs px-2.5 py-1 rounded-lg font-bold hover:bg-amber-600">
                            + السلة
                        </button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product-item bg-white rounded-xl overflow-hidden border shadow-sm relative group block" data-title="يد بلايستيشن 5 ps5 controller">
                <a href="product.html">
                    <div class="h-44 bg-gray-100 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover group-hover:scale-105 transition">
                    </div>
                </a>
                <div class="p-3 text-right">
                    <h4 class="font-bold text-xs truncate">يد بلايستيشن 5 أصلية</h4>
                    <p class="text-[10px] text-gray-400 mt-1"><i class="fa-solid fa-location-dot"></i> إربد</p>
                    <div class="flex items-center justify-between mt-3">
                        <p class="font-black text-amber-600 text-sm">299 ر.س</p>
                        <button onclick="addToCartReal('يد بلايستيشن 5', 299)" class="bg-amber-500 text-white text-xs px-2.5 py-1 rounded-lg font-bold hover:bg-amber-600">
                            + السلة
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. نظام الحساب والإعلان الفعلي
        function checkAuthAndAddAd(e) {
            e.preventDefault();
            const isLoggedIn = localStorage.getItem('user_logged_in');
            if (!isLoggedIn) {
                window.location.href = 'login.html?redirect=add-ad.html';
            } else {
                window.location.href = 'add-ad.html';
            }
        }

        // 2. البحث والتوجيه السري لصفحة الأدمن
        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (query === 'lobbyadmin0P') {
                window.location.href = 'admin.html';
                return;
            }
            const items = document.querySelectorAll('.product-item');
            items.forEach(item => {
                const title = item.getAttribute('data-title').toLowerCase();
                item.style.display = title.includes(query.toLowerCase()) || query === '' ? 'block' : 'none';
            });
        }

        // 3. السلة الحقيقية (حفظ وتحديث بالديناميكية)
        let cart = JSON.parse(localStorage.getItem('user_cart') || '[]');
        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotalText').innerText = total + ' ر.س';
        }
        function addToCartReal(name, price) {
            cart.push({ name, price });
            localStorage.setItem('user_cart', JSON.stringify(cart));
            updateCartUI();
        }
        updateCartUI();

        // 4. ترجمة النصوص الفعلية (بدون pop-up)
        let currentLang = 'ar';
        const translations = {
            en: {
                slogan: 'Buy & Sell Everything',
                messages: 'Messages',
                favorites: 'Favorites',
                account: 'Account',
                login: 'Login',
                cart: 'Cart',
                allCategories: 'All Categories',
                home: 'Home',
                chatSellers: 'Seller Chat',
                addAd: '+ Post Ad',
                latestAds: 'Latest Listings'
            },
            ar: {
                slogan: 'تسوق وسوق كل ما تحتاجه',
                messages: 'الرسائل',
                favorites: 'المفضلة',
                account: 'حسابي',
                login: 'تسجيل دخول',
                cart: 'السلة',
                allCategories: 'كل الأقسام',
                home: 'الرئيسية',
                chatSellers: 'محادثات البائعين',
                addAd: '+ إضافة إعلان',
                latestAds: 'أحدث الإعلانات والمنتجات'
            }
        };

        function toggleRealLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('htmlTag').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('langText').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            
            document.querySelectorAll('[data-key]').forEach(elem => {
                const key = elem.getAttribute('data-key');
                if (translations[currentLang][key]) {
                    elem.innerText = translations[currentLang][key];
                }
            });
        }
    </script>
</body>
</html>
