<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID SOOQ - الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f8f9fa] font-sans text-gray-800 min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-amber-500 text-white p-2.5 rounded-xl shadow-sm"><i class="fa-solid fa-bag-shopping text-lg"></i></div>
                <span class="text-xl font-black text-gray-900">GRID SOOQ</span>
            </a>

            <div class="flex items-center gap-3 text-xs">
                <a href="add-ad.html" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2.5 rounded-xl transition shadow-sm">
                    <i class="fa-solid fa-plus ml-1"></i> أضف إعلان
                </a>
                <a href="signin.html" id="authLink" class="border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold px-4 py-2.5 rounded-xl transition">
                    تسجيل الدخول
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-lg font-black text-gray-900">أحدث المنتجات والإعلانات</h1>
            <span id="userStatus" class="text-xs text-gray-500 font-bold"></span>
        </div>

        <!-- Ads Grid Container -->
        <div id="adsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Loading state -->
            <div class="col-span-full text-center py-12 text-gray-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-amber-500"></i>
                <p>جاري تحميل الإعلانات...</p>
            </div>
        </div>
    </main>

    <!-- Firebase Logic -->
    <script type="module">
        import { db, ref, onValue, auth, onAuthStateChanged, signOut } from "./firebase-config.js";

        const adsContainer = document.getElementById('adsContainer');
        const authLink = document.getElementById('authLink');
        const userStatus = document.getElementById('userStatus');

        // متابعة حالة تسجيل الدخول للمستخدم
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authLink.innerText = "تسجيل الخروج";
                authLink.href = "#";
                authLink.onclick = async () => {
                    await signOut(auth);
                    window.location.reload();
                };
                userStatus.innerText = `مرحباً: ${user.displayName || user.email}`;
            } else {
                authLink.innerText = "تسجيل الدخول";
                authLink.href = "signin.html";
                userStatus.innerText = "";
            }
        });

        // جلب الإعلانات من Realtime Database وعرضها تلقائياً
        const adsRef = ref(db, 'ads');
        onValue(adsRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                adsContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-gray-200 text-gray-400 text-xs">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-gray-300"></i>
                        <p>لا توجد إعلانات مضافة حالياً. كن أول من يضيف إعلاناً!</p>
                    </div>
                `;
                return;
            }

            adsContainer.innerHTML = '';
            // ترتيب الإعلانات من الأحدث للأقدم
            const adsEntries = Object.entries(data).reverse();

            adsEntries.forEach(([id, ad]) => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col";
                card.innerHTML = `
                    <div class="h-48 bg-gray-100 overflow-hidden relative">
                        <img src="${ad.image}" alt="${ad.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                        <span class="absolute top-3 left-3 bg-gray-900/80 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg backdrop-blur-sm">
                            $${ad.price}
                        </span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-bold text-sm text-gray-900 mb-1 line-clamp-1">${ad.title}</h3>
                        <p class="text-gray-500 text-xs line-clamp-2 mb-4 flex-grow">${ad.story}</p>
                        <button onclick="alert('تم النقر على المنتج: ${ad.title}')" class="w-full bg-gray-100 hover:bg-amber-500 hover:text-white text-gray-800 font-bold py-2 rounded-xl text-xs transition">
                            تفاصيل المنتج
                        </button>
                    </div>
                `;
                adsContainer.appendChild(card);
            });
        });
    </script>
</body>
</html>
