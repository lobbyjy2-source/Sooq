<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID SOOQ - لوحة التحكم السريّة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Admin Header -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="bg-red-600 text-white text-xs px-2 py-1 rounded font-bold">ADMIN PANEL</span>
            <h1 class="font-black text-lg">لوحة إشراف Grid Sooq</h1>
        </div>
        <a href="index.html" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg">العودة للموقع</a>
    </header>

    <div class="container mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-xs text-gray-400">إجمالي الإعلانات</p>
                <h2 class="text-2xl font-bold mt-1">124</h2>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-xs text-gray-400">المستخدمين المسجلين</p>
                <h2 class="text-2xl font-bold mt-1">45</h2>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-xs text-gray-400">الإعلانات المعلقة للمراجعة</p>
                <h2 class="text-2xl font-bold text-amber-500 mt-1">3</h2>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
            <h3 class="font-bold mb-4 text-sm">إدارة الإعلانات الأخيرة</h3>
            <div class="text-xs text-gray-400 text-center py-6">
                هنا يمكنك حذف الإعلانات، الموافقة عليها، أو حظر المستخدمين المخالفين.
            </div>
        </div>
    </div>

</body>
</html>
