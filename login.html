<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID SOOQ - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f8f9fa] font-sans text-gray-800 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-sm border w-full max-w-md">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center gap-2 mb-2">
                <div class="bg-amber-500 text-white p-2 rounded-lg"><i class="fa-solid fa-bag-shopping"></i></div>
                <span class="text-2xl font-black text-gray-900">GRID SOOQ</span>
            </a>
            <p class="text-xs text-gray-500">سجل دخولك لإدارة إعلاناتك ومفضلتك</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold mb-1">البريد الإلكتروني / اسم المستخدم</label>
                <input type="text" id="username" required class="w-full border rounded-lg p-3 outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block font-bold mb-1">كلمة المرور</label>
                <input type="password" required class="w-full border rounded-lg p-3 outline-none focus:border-amber-500">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            localStorage.setItem('user_logged_in', 'true');
            alert('تم تسجيل الدخول بنجاح!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
