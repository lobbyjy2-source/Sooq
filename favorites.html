<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID SOOQ - المفضلة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f8f9fa] font-sans text-gray-800">
    <header class="bg-white border-b py-4">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-amber-500 text-white p-2 rounded-lg"><i class="fa-solid fa-bag-shopping"></i></div>
                <span class="text-xl font-black text-gray-900">GRID SOOQ</span>
            </a>
            <a href="index.html" class="text-xs font-bold text-amber-600 hover:underline"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8">
        <h2 class="text-2xl font-black text-gray-900 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-heart text-red-500"></i> قائمة المنتجات المفضلة
        </h2>

        <div id="favListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Favorites Render via JS -->
        </div>
    </div>

    <script>
        function renderFavs() {
            const favs = JSON.parse(localStorage.getItem('fav_items_list') || '[]');
            const container = document.getElementById('favListContainer');

            if (favs.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">لا يوجد أي منتجات في المفضلة حالياً.</div>`;
                return;
            }

            container.innerHTML = favs.map(item => `
                <div class="bg-white rounded-xl border p-3 flex items-center gap-4 shadow-sm">
                    <img src="${item.img}" class="w-16 h-16 object-cover rounded-lg">
                    <div class="flex-1">
                        <h4 class="font-bold text-xs truncate">${item.title}</h4>
                        <p class="text-amber-600 font-black text-sm mt-1">${item.price} ر.س</p>
                    </div>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', renderFavs);
    </script>
</body>
</html>
