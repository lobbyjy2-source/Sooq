<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID SOOQ - المفضلة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 border-b">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-amber-500 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                </div>
                <span class="text-xl font-black text-gray-900">GRID SOOQ</span>
            </a>
            <a href="index.html" class="text-xs font-bold text-amber-600 hover:underline">
                <i class="fa-solid fa-arrow-right ml-1"></i> العودة للرئيسية
            </a>
        </div>
    </header>

    <!-- Favorites Content -->
    <div class="container mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-black">الإعلانات المفضلة <i class="fa-solid fa-heart text-red-500 mr-2"></i></h1>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            
            <!-- Item 1 -->
            <div class="bg-white rounded-xl overflow-hidden border shadow-sm relative group">
                <button class="absolute top-2 left-2 text-red-500 z-10 text-lg"><i class="fa-solid fa-heart"></i></button>
                <div class="h-40 bg-gray-100 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover" alt="MacBook">
                </div>
                <div class="p-3 text-right">
                    <h4 class="font-bold text-xs truncate">MacBook Air M2</h4>
                    <p class="text-[10px] text-gray-400 mt-1"><i class="fa-solid fa-location-dot"></i> الرياض</p>
                    <p class="font-black text-amber-600 mt-2 text-sm">4,200 ر.س</p>
                    <a href="product.html" class="mt-3 block text-center bg-gray-100 hover:bg-amber-500 hover:text-white font-bold py-1.5 rounded-lg text-xs transition">عرض التفاصيل</a>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="bg-white rounded-xl overflow-hidden border shadow-sm relative group">
                <button class="absolute top-2 left-2 text-red-500 z-10 text-lg"><i class="fa-solid fa-heart"></i></button>
                <div class="h-40 bg-gray-100 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover" alt="Car">
                </div>
                <div class="p-3 text-right">
                    <h4 class="font-bold text-xs truncate">تويوتا لاندكروزر 2022</h4>
                    <p class="text-[10px] text-gray-400 mt-1"><i class="fa-solid fa-location-dot"></i> الدمام</p>
                    <p class="font-black text-amber-600 mt-2 text-sm">189,000 ر.س</p>
                    <a href="product.html" class="mt-3 block text-center bg-gray-100 hover:bg-amber-500 hover:text-white font-bold py-1.5 rounded-lg text-xs transition">عرض التفاصيل</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
